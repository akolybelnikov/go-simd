name: Package simdlab

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows-amd64
            binary: simdlab.exe
          - os: ubuntu-latest
            platform: linux-amd64
            binary: simdlab
    runs-on: ${{ matrix.os }}
    env:
      GOEXPERIMENT: simd
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: go test ./cmd/simdlab -run '^TestLocalUI' -count=1
      - run: go build -trimpath -o ${{ matrix.binary }} ./cmd/simdlab
      - run: python scripts/package-simdlab.py ${{ matrix.binary }} ${{ matrix.platform }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  draft:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Stage verified binaries as a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes release/*
