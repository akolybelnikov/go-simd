name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOEXPERIMENT: simd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l cmd internal examples)
          if [ -n "$files" ]; then printf '%s\n' "$files"; exit 1; fi
      - run: go test ./...
      - run: go vet ./...
      - name: Check portable kernel emulation
        env:
          GODEBUG: simd=0
        run: |
          go test ./internal/patterns ./internal/reduction ./internal/movement ./internal/catalog/kernels ./internal/engine -count=1
          go test ./cmd/simdreport -run='^TestFMAResultsAndBackendIdentity$' -count=1
          go test ./cmd/simdreport -run='^TestDotFMAResultsAndBackendIdentity$' -count=1
          go test ./cmd/simdreport -run='^TestPredicateResultsAndBackendIdentity$' -count=1
          go test ./cmd/simdreport -run='^TestPackedPredicateResultsAndBackendIdentity$' -count=1
          go test ./cmd/simdreport -run='^TestCopyResultsAndBackendIdentity$' -count=1
          go test ./cmd/simdreport -run='^TestClampResultsAndBackendIdentity$' -count=1
          go test ./cmd/simdreport -run='^TestMulAddResultsAndBackendIdentity$' -count=1
          go test ./internal/addition -run='Addition64' -count=1
          go test ./cmd/simdreport -run='^TestAddition64ResultsAndBackendIdentity$' -count=1
          go test ./internal/integer -count=1
          go test ./cmd/simdreport -run='^TestSaturatingAdd8ResultsAndBackendIdentity$' -count=1
      - name: Check races
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Check filtered benchmark
        run: go test ./internal/addition ./internal/computation ./internal/reduction -run='^$' -bench='^Benchmark(Addition|Computation|Sum|Dot)$/^n=1$/^Scalar$' -benchtime=1x
      - name: Check accumulator strategies
        run: go test ./internal/reduction -run='^$' -bench='^Benchmark(Sum|Dot)$/^n=64$/^SIMDStriped(2|4)$' -benchtime=1x
      - name: Check fused affine paths
        run: go test ./internal/patterns -run='^$' -bench='^BenchmarkAffineFMA$/^n=(8|16)$' -benchtime=1x
      - name: Check fused dot paths
        run: go test ./internal/reduction -run='^$' -bench='^BenchmarkDotFMA$/^n=(1|8|16)$' -benchtime=1x
      - name: Check predicate export
        run: go test ./internal/patterns -run='^$' -bench='^BenchmarkPredicate$/^n=(1|8|16)$' -benchtime=1x
      - name: Check packed predicate export
        run: go test ./internal/patterns -run='^$' -bench='^BenchmarkPredicatePacked$/^n=(7|8|9|63|64|65)$' -benchtime=1x
      - name: Check copy controls
        run: go test ./internal/movement -run='^$' -bench='^BenchmarkCopy$/^n=(1|8|16|65536)$' -benchtime=1x

      - name: Check ordered clamp controls
        run: go test ./internal/patterns -run='^$' -bench='^BenchmarkClamp$/^n=(1|8|16)$' -benchtime=1x

      - name: Check three-array fused multiply-add
        run: go test ./internal/patterns -run='^$' -bench='^BenchmarkMulAdd$/^n=(1|8|16)$' -benchtime=1x

      - name: Check float64 addition
        run: go test ./internal/addition -run='^$' -bench='^BenchmarkAddition64$/^n=(1|8|16)$' -benchtime=1x

      - name: Check uint8 saturating addition
        run: go test ./internal/integer -run='^$' -bench='^BenchmarkSaturatingAdd8$/^n=(1|16|32|64)$' -benchtime=1x
